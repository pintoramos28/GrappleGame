approval_policy = "never"
model = "gpt-5.6-luna"
model_reasoning_effort = "max"
personality = "pragmatic"
sandbox_mode = "danger-full-access"
windows_wsl_setup_acknowledged = true

[agents]
max_depth = 3

[mcp_servers."godot-ai"]
command = "C:\\Python314/pythonw.exe"
args = [
  "-c",
  "import subprocess,sys; raise SystemExit(subprocess.call(sys.argv[1:], stdin=sys.stdin, stdout=sys.stdout, stderr=sys.stderr, creationflags=0x08000000))",
  "C:\\Users\\pinto/.local/bin/uvx.exe",
  "--isolated",
  "--no-config",
  "--no-env-file",
  "--no-sources",
  "--no-build",
  "--index-strategy",
  "first-index",
  "--keyring-provider",
  "disabled",
  "--index",
  "https://pypi.org/simple",
  "--default-index",
  "https://pypi.org/simple",
  "--find-links",
  "https://pypi.org/simple/godot-ai/",
  "--link-mode",
  "copy",
  "--from",
  "godot-ai==4.0.4",
  "godot-ai",
  "attach",
  "--port",
  "8000",
  "--ws-port",
  "9500",
]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 360
